<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Accesible - Gonzalo Bernal</title>
    <style>
        /* --- ESTILOS CRÍTICOS DE ACCESIBILIDAD --- */
        
        /* 1. Variables para contraste AAA (7:1) */
        :root {
            --bg-color: #ffffff;
            --text-color: #222222;
            --primary-blue: #004477; /* Azul oscuro accesible */
            --focus-color: #d93025;  /* Rojo de alto impacto para el foco */
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 2. Foco Visible OBLIGATORIO (WCAG 2.4.7) */
        :focus-visible {
            outline: 3px solid var(--focus-color);
            outline-offset: 4px;
            border-radius: 2px;
        }

        /* 3. Enlace "Saltar al contenido" (WCAG 2.4.1) */
        .skip-link {
            position: absolute;
            top: -100px;
            left: 0;
            background: var(--primary-blue);
            color: #fff;
            padding: 12px;
            z-index: 100;
            text-decoration: none;
            font-weight: bold;
            transition: top 0.3s;
        }
        
        .skip-link:focus {
            top: 0;
        }

        /* Estilos generales */
        header {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            gap: 20px;
        }

        nav a {
            color: var(--primary-blue);
            font-weight: bold;
            text-decoration: none;
            padding: 5px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .form-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 700;
        }

        input[type="text"] {
            padding: 10px;
            width: 100%;
            max-width: 300px;
            border: 2px solid #767676;
            border-radius: 4px;
        }

        /* Botón accesible real */
        .btn-submit {
            background-color: var(--primary-blue);
            color: #ffffff;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            display: inline-block;
        }

        .btn-submit:hover {
            background-color: #002a4b;
        }
    </style>
</head>
<body>

    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

    <header>
        <a href="/" aria-label="Ir a la página de inicio">
            <img src="/Proyecto Accesibilidad/imagenes/logo.png" alt="Logotipo de Gonzalo Bernal" width="50" height="auto">
        </a>

        <nav aria-label="Menú principal">
            <ul>
                <li><a href="/">Inicio</a></li>
                <li><a href="/contacto">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content">
        <h1>Bienvenido a mi Web</h1>

        <section class="form-section" aria-labelledby="form-title">
            <h2 id="form-title">Registro de usuario</h2>
            <p>Rellena el formulario a continuación para enviarnos tus datos.</p>

            <form action="#" method="POST">
                <div class="form-group">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required autocomplete="name">
                </div>

                <button type="submit" class="btn-submit" onclick="alert('Formulario enviado correctamente')">
                    Enviar formulario
                </button>
            </form>
        </section>
    </main>

    <footer>
        <p><small>&copy; 2026 Gonzalo Bernal. Sitio conforme a WCAG 2.2 Nivel AA.</small></p>
    </footer>

</body>
</html>
